name: Weekly FMP Screener

on:
  schedule:
    # 20:00 UTC = 23:00 Helsinki (EEST, UTC+3 in summer)
    # Runs once a week on Sunday so a fresh dataset is ready for Monday's open
    - cron: '0 20 * * 0'
  workflow_dispatch:   # Manual "Run workflow" button in GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # weekly cold fetch (~8000 stocks) + Sonnet/Opus AI; 6h job cap

    steps:
      # ── 1. Check out this private repo (code + data files) ──────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to commit data files back after the run
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Restore FMP cache between runs (lets intra-week manual re-runs reuse data) ──
      - name: Cache FMP data
        uses: actions/cache@v4
        with:
          path: fmp_screener_cache.json
          # Key rotates per run; restore-keys lets a manual mid-week re-run reuse the
          # most recent cache. The 6-day TTL (CACHE_DAYS) forces the weekly run to refetch.
          key: fmp-cache-${{ github.run_id }}
          restore-keys: fmp-cache-

      # ── 4. Run the screener ──────────────────────────────────────────────────
      - name: Run screener
        env:
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GITHUB_REPO = the PUBLIC pages repo ("Metsapaholainen/fmp-screener")
          GITHUB_REPO:       ${{ secrets.PAGES_REPO }}
          # GITHUB_TOKEN here is a PAT with write access to the PUBLIC pages repo
          GITHUB_TOKEN:      ${{ secrets.PAGES_TOKEN }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          # Give specialists live FMP tool access (financial statements, estimates, news, insiders)
          USE_FMP_TOOLS:     "1"
        run: python FMP_stock_screener.py

      # ── 5. Commit updated data files back to THIS private repo ───────────────
      - name: Save data files
        run: |
          git config user.name  "fmp-screener[bot]"
          git config user.email "fmp-screener[bot]@users.noreply.github.com"
          git add fmp_picks_log.csv fmp_ai_picks_log.csv fmp_portfolio.json
          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "run: $(date '+%Y-%m-%d')"
          git push
